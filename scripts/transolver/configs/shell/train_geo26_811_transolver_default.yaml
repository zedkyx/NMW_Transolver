# Transolver 已发表默认（thuml/Transolver，PDE-Solving-StandardBenchmark）
# 来源: exp_darcy / exp_airfoil / exp_ns / exp_pipe / exp_plas 的 argparse 默认值。
# 论文 arXiv:2402.02366 训练表与此一致：500 epoch，AdamW，lr=1e-3，weight_decay=1e-5。
# 弹性力学脚本 exp_elas 用的是按 epoch 的余弦退火，不是这一份。
#
# 标成「默认」的项（相对 train_geo26_500_811_onecycle2000.yaml）:
#   epochs 500
#   weight_decay 1e-5
#   batch_size 8
#   n_layers 3
#   n_heads 4
#   mlp_ratio 1
#   max_grad_norm 0（官方是 None，即不裁剪；本仓库 if max_grad_norm 为假时不裁剪）
#   lr 0.001，lr_scheduler onecycle
#   OneCycleLR 不改 PyTorch 默认: pct_start=0.3, div_factor=25, final_div_factor=1e4
#   优化器 AdamW 在训练代码里，yaml 不写
#   n_hidden 64，slice_num 32，dropout 0 与官方默认相同，这份沿用
#
# 官方脚本没有、仍按壳体任务保留:
#   同一份 qjt_s2 cache，Mises + MaxPrincipal
#   8:1:1，seed=42，train_seed=42
#   Transolver_1D，FiLM policy=all（层数改为 3 后，all 注入 0–2）
#   节点权重 equal_div_inc，评测 mesh_equal
#   early_stop=0，让 500 步的 OneCycle 跑完
#   lr_min 只给余弦/plateau 用，OneCycle 不读
#
# 启动:
# bash scripts/transolver/sh/shell/train.sh \
#   --config scripts/transolver/configs/shell/train_geo26_811_transolver_default.yaml
#

key:
  save_name: "geo26_811_full_film_all_transolver_default_epoch500_seed42"
  run_dir: "/home/wang/transolver/runs/shell/essay/geo26_sched/{save_name}_{timestamp}"
  gpu: "0"
  use_multi_net: 0
  seed: 42
  train_seed: 42

queue:
  enabled: true
  start_from: ""
  jobs:
    - id: qjt_s2
      cache_path: "/home/wang/zyx/cache_geo24_len/full/u0_s2_n6420/qjt_1_full.pt"
      output_cols: ["Mises", "MaxPrincipal"]

data:
  train_split: 0.8
  val_split: 0.1
  split_by: "random"
  normalize_coords: 1
  padding: 1
  padding_value: 0.0
  pos_norm_type: "min-max"
  fx_norm_type: "mean-std"
  y_norm_type: "mean-std"
  filter_degenerate_y: 1
  y_degenerate_eps: 1.0e-6
  empty_fx: 0
  sdf_to_pos: 0
  use_sato: 0
  quad_sato: 0
  sato_index_path: ""
  sato_grid_size: 0.01
  use_node_weight: 1
  node_weight_in_attn: 1
  node_weight_in_norm: 1
  node_weight_in_norm_fx: 1
  node_weight_in_norm_y: 1
  node_weight_in_loss: 1
  node_weight_method: mesh
  node_weight_lumping: equal_div_inc
  persist_node_weight: 0
  recompute_node_weight: 0
  node_weight_max_edge: 0.0
  abaqus_root: "/home/wang/keti_abaqus_geo24_len"
  npz_dir: "/home/wang/keti_abaqus_geo24_len/cache_npz"
  mesh_instance_name: "QJT-1"

model:
  name: "Transolver_1D"
  time_input: 0
  use_multi_net: 0
  use_spectral: 0
  spectral_modes: 32
  spectral_hi_freq_boost: 0.0
  n_hidden: 64
  n_layers: 3
  n_heads: 4
  dropout: 0.0
  mlp_ratio: 1
  slice_num: 32
  ref: 8
  unified_pos: 1
  use_edge_conv: 0
  use_linearno: 0
  space_dim: 2
  use_geom_memory: 1
  geom_memory_policy: "all"
  geom_memory_dim: 0
  geom_encoder_hidden: 0
  geom_sdf_channel: -1

train:
  batch_size: 8
  epochs: 500
  lr: 0.001
  weight_decay: 1.0e-5
  lr_scheduler: onecycle
  lr_min: 1.0e-6
  early_stop: 0
  early_stop_patience: 100
  early_stop_min_delta_rel: 0.001
  max_grad_norm: 0.0
  sdf_weight_alpha: 0.0
  grad_loss_weight: 0
  knn_enable: 0
  knn_cache_rebuild: 0
  knn_block_size: 256
  grad_eps: 1e-6

eval:
  max_eval_batches: 0
  viz_interval: 100
  eval_interval: 1
  auto_eval: 1
  auto_eval_ckpt: best_eval
  plot_attn_rank: 0
  attn_rank_only: 0
  attn_rank_rel_tol: 1.0e-3
  attn_rank_overlay: ""
  eval_rel_l2_quadrature: 1
  eval_q_source: mesh_equal
  high_stress_analysis: 1
  num_plot: 0
