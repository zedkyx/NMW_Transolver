# geo27（27 维几何+载荷，无材料变化）+ All GeomMemory FiLM
#   只跑 qjt 应力 s2 → Mises + MaxPrincipal
#   cache: /home/wang/zyx/cache_geo27/full/u0_s2_n12725/qjt_1_full.pt
#   节点测度直接读同目录 qjt_1_full_nw_equal_div_inc.pt（不从 SHDX.inp 重算）
#   评测 RelL2 用同一份 equal_div_inc（没有 mesh_equal sidecar，也没有全套 inp）
#
#   4 层，FiLM policy=all
#   1000 epoch，early_stop=0，8:1:1，auto_eval 用验证集 best_eval
#
# 启动:
#   bash scripts/transolver/sh/shell/train.sh \
#     --config scripts/transolver/configs/shell/train_geo26_film_all_9parts.yaml
# 预览:
#   bash scripts/transolver/sh/shell/train.sh \
#     --config scripts/transolver/configs/shell/train_geo26_film_all_9parts.yaml --dry_run
# 断点:
#   bash scripts/transolver/sh/shell/train.sh \
#     --config scripts/transolver/configs/shell/train_geo26_film_all_9parts.yaml --start_from hjt_u

key:
  save_name: "geo27_film_all_qjt"
  run_dir: "/home/wang/transolver/runs/shell/result/geo27/{save_name}_{timestamp}"
  gpu: "0"
  use_multi_net: 0
  seed: 42

# mesh q 的 instance 名在各 job 内单独指定（勿在 data 写全局 QJT-1）
queue:
  enabled: true
  start_from: ""
  jobs:
    - id: qjt_s2
      cache_path: "/home/wang/zyx/cache_geo27/full/u0_s2_n12725/qjt_1_full.pt"
      output_cols: ["Mises", "MaxPrincipal"]
      mesh_instance_name: "QJT-1"
